name: Cheasst CI - Automated APK Build (Brute-Force)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "Release*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Brute-Force Build Cheasst APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4096m"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Executable Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Auto-Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi
          ls -la debug.keystore

      - name: Brute-Force Build Debug APK (Direct Assemble)
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint

      - name: Optional Test Execution (Non-Blocking)
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace || echo "Tests finished or reported non-fatal warnings"

      - name: Harvest and Verify Generated APK
        run: |
          mkdir -p build-output
          echo "Listing all generated APK files:"
          find app/build/outputs/ -name "*.apk" || find . -name "*.apk"
          
          # Find the debug APK
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*debug*.apk" | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/Cheasst-debug.apk
            echo "SUCCESS: Packaged $APK_FILE to build-output/Cheasst-debug.apk"
            ls -lh build-output/Cheasst-debug.apk
          else
            echo "FATAL: Could not locate built APK."
            exit 1
          fi

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Cheasst-Debug-APK
          path: build-output/Cheasst-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Cheasst-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
