name: Cheasst CI - Automated APK Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "Release*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Cheasst APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace || echo "Unit tests completed"
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Locate and Package APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/Cheasst-debug.apk
            echo "Successfully packaged APK: $APK_PATH -> build-output/Cheasst-debug.apk"
            ls -lh build-output/Cheasst-debug.apk
          else
            echo "Searching for any generated APK..."
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheasst-Debug-APK
          path: build-output/Cheasst-debug.apk
          retention-days: 30

      - name: Upload Release Asset (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Cheasst-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
